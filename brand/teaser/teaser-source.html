<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #777; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; align-items: flex-start; width: 4200px; }
  .art { position: relative; overflow: hidden; flex: none; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(90% 70% at 50% 42%, #1f9284 0%, #0f5f57 40%, #0a3d38 78%, #072e2a 100%); }
  .art::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.06) 1.5px, transparent 1.6px); background-size: 28px 28px; }
  .glow { position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(232,178,58,.22), transparent 65%); top: 50%; left: 50%; translate: -50% -58%; }
  .word { font: 800 1em/1 "Bricolage Grotesque"; letter-spacing: -0.035em; position: relative; z-index: 1; }
  .word b { color: #e8b23a; }
  svg { position: relative; z-index: 1; filter: drop-shadow(0 24px 50px rgba(0,0,0,.35)); }
  .day { position: absolute; z-index: 1; font: 800 1em/1 "Bricolage Grotesque"; color: rgba(255,255,255,.1); letter-spacing: -0.05em; }
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22a090"/><stop offset="1" stop-color="#0c4d47"/></linearGradient>
  <symbol id="logo" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="url(#g)" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/><path d="M30 28 L70 72" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M22 56 L38 72 L76 27" fill="none" stroke="#e8b23a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<section id="sq" class="art" style="width:1080px;height:1080px;gap:44px"><div class="glow"></div><svg width="300" height="300"><use href="#logo"/></svg><div class="word" style="font-size:132px">Xisab<b>Sax</b></div></section>
<section id="st" class="art" style="width:1080px;height:1920px;gap:56px"><div class="glow"></div><svg width="360" height="360"><use href="#logo"/></svg><div class="word" style="font-size:150px">Xisab<b>Sax</b></div></section>
<section id="cv" class="art" style="width:1640px;height:624px;flex-direction:row;gap:48px"><div class="glow" style="width:40%"></div><svg width="220" height="220"><use href="#logo"/></svg><div class="word" style="font-size:150px">Xisab<b>Sax</b></div></section>

<!-- countdown: 7 stories, the number is a faint giant mark behind the logo, no words -->
<template id="cd"><section class="art cdn" style="width:1080px;height:1920px;gap:56px"><div class="day" style="font-size:1100px;top:50%;left:50%;translate:-50% -55%"></div><div class="glow"></div><svg width="320" height="320"><use href="#logo"/></svg><div class="word" style="font-size:140px">Xisab<b>Sax</b></div></section></template>
<div id="cds" style="display:flex;gap:40px"></div>
<script>
  const t = document.getElementById("cd"), box = document.getElementById("cds");
  for (let n = 7; n >= 1; n--) { const c = t.content.cloneNode(true); const s = c.querySelector("section"); s.id = "d" + n; s.querySelector(".day").textContent = n; box.appendChild(c); }
</script>
</body></html>
